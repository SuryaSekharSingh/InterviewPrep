<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>InterviewEdge · Content review</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script></head>
<body><main><header><h1>InterviewEdge</h1><p>Content administration</p></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="login"><h2>Administrator sign in</h2><form id="signin">
<label>Username<input id="username" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<section id="workspace" hidden><nav aria-label="Administration"><button id="questions">Questions</button><button id="seeds">Interview prompts</button><button id="reviews">Pending marks</button><button id="export">Export question bank</button><button id="logout">Sign out</button></nav>
<details><summary>Create or import draft questions</summary><p>Published content is immutable. Revise a question by creating a draft with its family ID. A different administrator must review and publish it.</p>
<label>Question JSON<textarea id="draft" rows="12" spellcheck="false"></textarea></label><button id="save">Create draft</button>
<label>Import JSON array (up to 300 questions)<input id="import" type="file" accept=".json,application/json"></label></details>
<div id="list"></div></section></main></body></html>
