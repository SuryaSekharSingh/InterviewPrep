plugins { id 'com.android.application' }
def config = new Properties()
def configFile = rootProject.file('local.properties')
if (configFile.exists()) configFile.withInputStream { config.load(it) }
def quoted = { value -> '"' + value.replace('\\','\\\\').replace('"','\\"') + '"' }
android {
 namespace 'com.interviewedge'
 compileSdk 35
 defaultConfig {
  applicationId 'com.interviewedge'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '0.1.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildTypes {
  debug { buildConfigField 'String','API_URL','"http://10.0.2.2:8080/api/v1/"' }
  release { minifyEnabled false; buildConfigField 'String','API_URL',quoted(config.getProperty('api.releaseUrl','https://localhost/api/v1/')) }
 }
 buildFeatures { buildConfig true; viewBinding true }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'androidx.fragment:fragment:1.8.6'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
 implementation 'androidx.room:room-runtime:2.6.1'
 annotationProcessor 'androidx.room:room-compiler:2.6.1'
 implementation 'androidx.work:work-runtime:2.10.0'
 implementation 'com.squareup.retrofit2:retrofit:2.11.0'
 implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
